    <!-- RESET PAGE -->
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="/img/logo-white.png" alt="Silponix" class="logo-light">
                <img src="/img/logo.png" alt="Silponix" class="logo-dark">
            </div>

            <!-- REQUEST FORM (default) -->
            <div id="requestView">
                <h1 class="auth-title">Reset hesla</h1>
                <p class="auth-subtitle">Zadejte sv&#367;j e-mail a po&scaron;leme v&aacute;m odkaz pro nastaven&iacute; nov&eacute;ho hesla.</p>

                <div class="auth-error" id="requestError" hidden></div>
                <div class="auth-success" id="requestSuccess" hidden></div>

                <form id="requestForm">
                    <div class="form-group">
                        <label for="requestEmail" class="form-label">E-mail</label>
                        <input type="email" id="requestEmail" name="email" class="form-input" placeholder="vas@email.cz" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg btn-block" id="requestBtn">
                        <span class="btn-text">Odeslat odkaz</span>
                        <span class="btn-loading" hidden>Odes&iacute;l&aacute;m...</span>
                    </button>
                </form>
            </div>

            <!-- SET NEW PASSWORD FORM (when ?token=xxx) -->
            <div id="setView" hidden>
                <h1 class="auth-title">Nov&eacute; heslo</h1>
                <p class="auth-subtitle">Zadejte sv&eacute; nov&eacute; heslo.</p>

                <div class="auth-error" id="setError" hidden></div>
                <div class="auth-success" id="setSuccess" hidden></div>

                <form id="setForm">
                    <div class="form-group">
                        <label for="newPassword" class="form-label">Nov&eacute; heslo</label>
                        <input type="password" id="newPassword" name="password" class="form-input" placeholder="Min. 6 znak&#367;" required minlength="6">
                        <span class="auth-hint">Minim&aacute;ln&#283; 6 znak&#367;</span>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Heslo znovu</label>
                        <input type="password" id="confirmPassword" name="password2" class="form-input" placeholder="Zopakujte heslo" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg btn-block" id="setBtn">
                        <span class="btn-text">Nastavit heslo</span>
                        <span class="btn-loading" hidden>Ukl&aacute;d&aacute;m...</span>
                    </button>
                </form>

    <script src="/js/main.js?v=7"></script>
    <script>
    (function() {
        'use strict';

        // Determine mode: request or set (based on ?token= param)
        var params = new URLSearchParams(window.location.search);
        var resetToken = params.get('token');

        var requestView = document.getElementById('requestView');
        var setView = document.getElementById('setView');

        if (resetToken) {
            requestView.hidden = true;
            setView.hidden = false;
            initSetForm(resetToken);
        } else {
            initRequestForm();
        }

        // ==================== REQUEST FORM ====================
        function initRequestForm() {
            var form = document.getElementById('requestForm');
            var errorEl = document.getElementById('requestError');
            var successEl = document.getElementById('requestSuccess');
            var submitBtn = document.getElementById('requestBtn');
            var emailInput = document.getElementById('requestEmail');

            function showError(msg) {
                errorEl.textContent = msg;
                errorEl.hidden = false;
                successEl.hidden = true;
            }

            function showSuccess(msg) {
                successEl.textContent = msg;
                successEl.hidden = false;
                errorEl.hidden = true;
            }

            function setLoading(loading) {
                var btnText = submitBtn.querySelector('.btn-text');
                var btnLoading = submitBtn.querySelector('.btn-loading');
                if (loading) {
                    btnText.hidden = true;
                    btnLoading.hidden = false;
                    submitBtn.disabled = true;
                } else {
                    btnText.hidden = false;
                    btnLoading.hidden = true;
                    submitBtn.disabled = false;
                }
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                errorEl.hidden = true;
                successEl.hidden = true;

                var email = emailInput.value.trim();
                if (!email) {
                    showError('Zadejte sv\u016fj e-mail.');
                    return;
                }

                setLoading(true);

                fetch('/api/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'request', email: email })
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    setLoading(false);
                    // Always show success to not leak email existence
                    showSuccess('Pokud existuje \u00fa\u010det s t\u00edmto e-mailem, odeslali jsme v\u00e1m odkaz pro reset hesla. Zkontrolujte svou schr\u00e1nku.');
                    form.reset();
                })
                .catch(function() {
                    setLoading(false);
                    // In sandbox mode, show success anyway
                    showSuccess('Pokud existuje \u00fa\u010det s t\u00edmto e-mailem, odeslali jsme v\u00e1m odkaz pro reset hesla. Zkontrolujte svou schr\u00e1nku.');
                    form.reset();
                });
            });
        }

        // ==================== SET NEW PASSWORD FORM ====================
        function initSetForm(token) {
            var form = document.getElementById('setForm');
            var errorEl = document.getElementById('setError');
            var successEl = document.getElementById('setSuccess');
            var submitBtn = document.getElementById('setBtn');
            var newPasswordInput = document.getElementById('newPassword');
            var confirmPasswordInput = document.getElementById('confirmPassword');

            function showError(msg) {
                errorEl.textContent = msg;
                errorEl.hidden = false;
                successEl.hidden = true;
            }

            function showSuccess(msg) {
                successEl.textContent = msg;
                successEl.hidden = false;
                errorEl.hidden = true;
            }

            function setLoading(loading) {
                var btnText = submitBtn.querySelector('.btn-text');
                var btnLoading = submitBtn.querySelector('.btn-loading');
                if (loading) {
                    btnText.hidden = true;
                    btnLoading.hidden = false;
                    submitBtn.disabled = true;
                } else {
                    btnText.hidden = false;
                    btnLoading.hidden = true;
                    submitBtn.disabled = false;
                }
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                errorEl.hidden = true;
                successEl.hidden = true;

                var password = newPasswordInput.value;
                var password2 = confirmPasswordInput.value;

                if (!password || !password2) {
                    showError('Vypl\u0148te ob\u011b pole.');
                    return;
                }

                if (password.length < 6) {
                    showError('Heslo mus\u00ed m\u00edt alespo\u0148 6 znak\u016f.');
                    return;
                }

                if (password !== password2) {
                    showError('Hesla se neshoduj\u00ed.');
                    return;
                }

                setLoading(true);

                fetch('/api/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'set', resetToken: token, password: password })
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    setLoading(false);
                    if (data.error) {
                        showError(data.error);
                    } else {
                        showSuccess('Heslo bylo \u00fasp\u011b\u0161n\u011b zm\u011bn\u011bno. Nyn\u00ed se m\u016f\u017eete p\u0159ihl\u00e1sit.');
                        form.reset();
                        // Redirect after 2s
                        setTimeout(function() {
                            window.location.href = '/klient/index.html';
                        }, 2000);
                    }
                })
                .catch(function() {
                    setLoading(false);
                    showError('Chyba p\u0159ipojen\u00ed. Zkuste to znovu.');
                });
            });
        }
    })();
    </script>
