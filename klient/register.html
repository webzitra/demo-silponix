<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrace &mdash; Silponix</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/img/favicon-32.png" type="image/png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <meta name="theme-color" content="#bd141b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"></noscript>
    <link rel="stylesheet" href="/css/style.css?v=8">
</head>
<body>
    <!-- ==================== NAVBAR ==================== -->
    <nav class="navbar nav-bar" id="navbar" role="navigation" aria-label="Hlavní navigace">
        <div class="container nav-bar-inner">
            <a href="/" class="navbar-logo" aria-label="Silponix &mdash; domů">
                <img src="/img/logo.png" alt="Silponix" width="80" height="80" class="logo-img logo-dark">
                <img src="/img/logo-white.png" alt="" width="80" height="80" class="logo-img logo-light" aria-hidden="true">
            </a>
            <div class="navbar-menu" id="navbarMenu" role="menubar">
                <a href="/" class="navbar-link" role="menuitem">Domů</a>
                <a href="/shop.html" class="navbar-link" role="menuitem">Shop</a>
                <a href="/sluzby.html" class="navbar-link" role="menuitem">Služby</a>
                <a href="/o-nas.html" class="navbar-link" role="menuitem">O&nbsp;nás</a>
                <a href="/kontakt.html" class="navbar-link" role="menuitem">Kontakt</a>
            </div>
            <div class="navbar-actions">
                <div class="lang-switcher" id="langSwitcher">
                    <button class="lang-switcher-toggle nav-icon-btn" id="langToggle" aria-label="Jazyk" aria-expanded="false">
                        <img src="/img/flags/cs.svg" alt="CZ" width="22" height="16" id="langToggleFlag">
                    </button>
                    <div class="lang-dropdown" role="menu">
                        <button class="lang-btn active" data-lang="cs" role="menuitem" aria-label="Česky">
                            <img src="/img/flags/cs.svg" alt="" width="20" height="15">Čeština
                        </button>
                        <button class="lang-btn" data-lang="en" role="menuitem" aria-label="English">
                            <img src="/img/flags/en.svg" alt="" width="20" height="15">English
                        </button>
                    </div>
                </div>
                <a href="/klient/" class="navbar-user nav-icon-btn active" aria-label="Můj účet" aria-current="page">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </a>
                <a href="/kosik.html" class="navbar-cart nav-icon-btn" id="navbarCart" aria-label="Košík">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    <span class="cart-count" id="cartCount" hidden>0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- ==================== AUTH PAGE ==================== -->
    <main class="auth-page">
        <div class="auth-bg" aria-hidden="true"></div>
        <div class="auth-veil" aria-hidden="true"></div>

        <div class="auth-card lit-card">
            <span class="lit-card-aura"></span>
            <span class="auth-badge">
                <span class="auth-badge-dot"></span>
                Klientská zóna · Registrace
            </span>
            <h1 class="auth-title">Vytvoření <span class="text-gradient">účtu</span></h1>
            <p class="auth-subtitle">Připojte se ke komunitě Silponix Honda &amp; Motorsport.</p>

            <div class="auth-error" id="registerError" hidden></div>

            <form id="registerForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="name" class="form-label">Jméno</label>
                    <div class="auth-input-wrap">
                        <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="name" name="name" class="form-input auth-input" placeholder="Vaše jméno" required autofocus autocomplete="name">
                    </div>
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">E-mail</label>
                    <div class="auth-input-wrap">
                        <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <input type="email" id="email" name="email" class="form-input auth-input" placeholder="vas@email.cz" required autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Heslo</label>
                    <div class="auth-input-wrap">
                        <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="password" name="password" class="form-input auth-input" placeholder="Min. 6 znaků" required minlength="6" autocomplete="new-password">
                    </div>
                    <span class="auth-hint">Minimálně 6 znaků</span>
                </div>
                <div class="form-group">
                    <label for="password2" class="form-label">Heslo znovu</label>
                    <div class="auth-input-wrap">
                        <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="password2" name="password2" class="form-input auth-input" placeholder="Zopakujte heslo" required minlength="6" autocomplete="new-password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block" id="registerBtn">
                    <span class="btn-text">Registrovat se</span>
                    <span class="btn-loading" hidden>Registruji…</span>
                </button>
            </form>

            <div class="auth-divider"><span>nebo</span></div>

            <div class="auth-links">
                <p>Už máte účet? <a href="/klient/index.html">Přihlaste se</a></p>
            </div>
        </div>
    </main>

    <!-- COOKIE BANNER -->
    <div class="cookie-banner" id="cookieBanner" hidden>
        <div class="cookie-inner">
            <p>Tento web používá cookies pro zlepšení vašeho zážitku.</p>
            <div class="cookie-actions">
                <button class="btn btn-sm btn-primary" id="cookieAccept">Přijmout</button>
                <button class="btn btn-sm btn-outline" id="cookieDecline">Odmítnout</button>
            </div>
        </div>
    </div>

    <script src="/js/main.js?v=8"></script>
    <script>
    (function() {
        'use strict';
        var form = document.getElementById('registerForm');
        var errorEl = document.getElementById('registerError');
        var registerBtn = document.getElementById('registerBtn');
        var nameInput = document.getElementById('name');
        var emailInput = document.getElementById('email');
        var passwordInput = document.getElementById('password');
        var password2Input = document.getElementById('password2');

        var sessionToken = localStorage.getItem('silponix_session');
        if (sessionToken) window.location.href = '/klient/dashboard.html';

        function showError(msg) { errorEl.textContent = msg; errorEl.hidden = false; }
        function hideError() { errorEl.hidden = true; }
        function setLoading(loading) {
            var btnText = registerBtn.querySelector('.btn-text');
            var btnLoading = registerBtn.querySelector('.btn-loading');
            btnText.hidden = loading;
            btnLoading.hidden = !loading;
            registerBtn.disabled = loading;
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            hideError();
            var name = nameInput.value.trim();
            var email = emailInput.value.trim();
            var password = passwordInput.value;
            var password2 = password2Input.value;

            if (!name || !email || !password || !password2) { showError('Vyplňte všechna pole.'); return; }
            if (password.length < 6) { showError('Heslo musí mít alespoň 6 znaků.'); return; }
            if (password !== password2) { showError('Hesla se neshodují.'); return; }

            setLoading(true);
            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, email: email, password: password })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                setLoading(false);
                if (data.sessionToken) {
                    localStorage.setItem('silponix_session', data.sessionToken);
                    if (data.client) localStorage.setItem('silponix_client', JSON.stringify(data.client));
                    window.location.href = '/klient/dashboard.html';
                } else {
                    showError(data.error || 'Registrace se nezdařila. Zkuste to znovu.');
                }
            })
            .catch(function() {
                setLoading(false);
                showError('Chyba připojení. Zkuste to znovu.');
            });
        });
    })();
    </script>
    <script src="/js/track.js?v=6" defer></script>
</body>
</html>
