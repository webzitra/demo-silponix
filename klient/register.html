    <!-- REGISTER PAGE -->
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="/img/logo-white.png" alt="Silponix" class="logo-light">
                <img src="/img/logo.png" alt="Silponix" class="logo-dark">
            </div>
            <h1 class="auth-title">Vytvo&#345;en&iacute; &uacute;&#269;tu</h1>

            <div class="auth-error" id="registerError" hidden></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name" class="form-label">Jm&eacute;no</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="Va&scaron;e jm&eacute;no" required autofocus>
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="vas@email.cz" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Heslo</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Min. 6 znak&#367;" required minlength="6">
                    <span class="auth-hint">Minim&aacute;ln&#283; 6 znak&#367;</span>
                </div>
                <div class="form-group">
                    <label for="password2" class="form-label">Heslo znovu</label>
                    <input type="password" id="password2" name="password2" class="form-input" placeholder="Zopakujte heslo" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block" id="registerBtn">
                    <span class="btn-text">Registrovat se</span>
                    <span class="btn-loading" hidden>Registruji...</span>
                </button>
            </form>

            <div class="auth-links">
                <p>U&#382; m&aacute;te &uacute;&#269;et? <a href="/klient/index.html">P&#345;ihla&scaron;te se</a></p>
            </div>
        </div>
    </main>

    <!-- COOKIE BANNER -->
    <div class="cookie-banner" id="cookieBanner" hidden>
        <div class="cookie-inner">
            <p>Tento web pou&#382;&iacute;v&aacute; cookies pro zlep&scaron;en&iacute; va&scaron;eho z&aacute;&#382;itku.</p>
            <div class="cookie-actions">
                <button class="btn btn-sm btn-primary" id="cookieAccept">P&#345;ijmout</button>
                <button class="btn btn-sm btn-outline" id="cookieDecline">Odm&iacute;tnout</button>
            </div>
        </div>
    </div>

    <script src="/js/main.js?v=7"></script>
    <script>
    (function() {
        'use strict';

        var form = document.getElementById('registerForm');
        var errorEl = document.getElementById('registerError');
        var registerBtn = document.getElementById('registerBtn');
        var nameInput = document.getElementById('name');
        var emailInput = document.getElementById('email');
        var passwordInput = document.getElementById('password');
        var password2Input = document.getElementById('password2');

        // If already logged in, redirect
        var sessionToken = localStorage.getItem('silponix_session');
        if (sessionToken) {
            window.location.href = '/klient/dashboard.html';
        }

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.hidden = false;
        }

        function hideError() {
            errorEl.hidden = true;
        }

        function setLoading(loading) {
            var btnText = registerBtn.querySelector('.btn-text');
            var btnLoading = registerBtn.querySelector('.btn-loading');
            if (loading) {
                btnText.hidden = true;
                btnLoading.hidden = false;
                registerBtn.disabled = true;
            } else {
                btnText.hidden = false;
                btnLoading.hidden = true;
                registerBtn.disabled = false;
            }
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            hideError();

            var name = nameInput.value.trim();
            var email = emailInput.value.trim();
            var password = passwordInput.value;
            var password2 = password2Input.value;

            if (!name || !email || !password || !password2) {
                showError('Vypl\u0148te v\u0161echna pole.');
                return;
            }

            if (password.length < 6) {
                showError('Heslo mus\u00ed m\u00edt alespo\u0148 6 znak\u016f.');
                return;
            }

            if (password !== password2) {
                showError('Hesla se neshoduj\u00ed.');
                return;
            }

            setLoading(true);

            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, email: email, password: password })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                setLoading(false);
                if (data.sessionToken) {
                    localStorage.setItem('silponix_session', data.sessionToken);
                    if (data.client) {
                        localStorage.setItem('silponix_client', JSON.stringify(data.client));
                    }
                    window.location.href = '/klient/dashboard.html';
                } else {
                    showError(data.error || 'Registrace se nezda\u0159ila. Zkuste to znovu.');
                }
            })
            .catch(function() {
                setLoading(false);
                showError('Chyba p\u0159ipojen\u00ed. Zkuste to znovu.');
            });
        });
    })();
    </script>
