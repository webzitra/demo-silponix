    <script>
    /* Prepend API-managed posts before static ones (if API available) */
    (function() {
        'use strict';
        var grid = document.getElementById('blogGrid');
        if (!grid) return;
        fetch('/api/posts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'list' })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!data.posts || !data.posts.length) return;
            var frag = document.createDocumentFragment();
            data.posts.forEach(function(p) {
                if (!p.published) return;
                var img = p.coverImage || '/img/blog/rally-magazin.jpg';
                if (img && !img.startsWith('http') && !img.startsWith('/')) img = '/api/media-serve/' + img;
                var a = document.createElement('a');
                a.href = '/blog/post.html?slug=' + encodeURIComponent(p.slug);
                a.className = 'blog-card-link';
                a.setAttribute('data-animate', '');
                a.innerHTML =
                    '<article class="blog-card"><div class="blog-card-img"><img src="' + img + '" alt="' + (p.title || '') + '" loading="lazy"></div>' +
                    '<div class="blog-card-body"><span class="blog-card-date">' + (p.date ? p.date.slice(0, 4) : '') + '</span>' +
                    '<h3 class="blog-card-title">' + (p.title || '') + '</h3>' +
                    '<p class="blog-card-desc">' + (p.excerpt || '') + '</p></div></article>';
                frag.appendChild(a);
            });
            grid.insertBefore(frag, grid.firstChild);
        })
        .catch(function() { /* keep static fallback */ });
    })();
    </script>
